<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineData - Estadísticas</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="cabecera">
    <h1>🎬 CineData</h1>

    <nav class="menu">
      <a href="index.html">Películas</a>
      <a href="estadisticas.html" aria-current="page">Estadísticas</a>
    </nav>
  </header>

  <main class="panel">
    <h2>Estadísticas por género</h2>

    <form id="form-estadisticas" class="filtros">
      <input type="number" name="minimo" placeholder="Mínimo de películas" min="1" max="5" step="1">
      <button type="submit">Filtrar</button>
    </form>

    <p id="estado" class="estado"></p>

    <table id="tabla" class="tabla" hidden>
      <thead>
        <tr><th>Género</th><th class="num">Películas</th><th class="num">Nota media</th></tr>
      </thead>
      <tbody id="cuerpo-tabla"></tbody>
    </table>
  </main>

  <script type="module" src="js/estadisticas.js"></script>
</body>
</html>
